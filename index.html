<!DOCTYPE html>
<html lang="ne">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Attendance System - District 325 F</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
    <style>
        .hidden { display: none; }
        .present-row { border-left: 5px solid #22c55e; }
        .absent-row { border-left: 5px solid #ef4444; }
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #1e3a8a;
            border-radius: 50%;
            width: 35px;
            height: 35px;
            animation: spin 1s linear infinite;
            display: inline-block;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col justify-between pb-20">

    <script>
        // ⚠️ आफ्नो नयाँ वेब एप डिपोलोयमेन्ट URL यहाँ राख्नुहोस्
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw0zczW1dhKkdFDmbvsXgTQi1hG9TPPLXXzbbyeHCeba2wjolynPB0RTNtdsWy0S1jR/exec";
        
        let currentReportData = { present: [], absent: [] };
        let countdownInterval = null;

        function showDialog(title, message, isSuccess = true) {
            const dialogBox = document.getElementById('customDialog');
            document.getElementById('dialogTitle').innerText = title;
            document.getElementById('dialogMessage').innerText = message;
            document.getElementById('dialogIcon').innerHTML = isSuccess ? "✅" : "❌";
            document.getElementById('dialogTitle').className = isSuccess ? "text-xl font-bold text-green-600 mb-2" : "text-xl font-bold text-red-600 mb-2";
            dialogBox.classList.remove('hidden');
        }

        function closeDialog() { document.getElementById('customDialog').classList.add('hidden'); }

        function startCountdownTimer(startTimeMs, serverTimeMs) {
            if(countdownInterval) clearInterval(countdownInterval);
            const timerBox = document.getElementById('countdownBox');
            const timerText = document.getElementById('countdownTimer');
            const targetTime = startTimeMs + (60 * 60 * 1000); 
            let clientServerDiff = Date.now() - serverTimeMs;

            countdownInterval = setInterval(() => {
                let timeLeft = targetTime - (Date.now() - clientServerDiff);
                if (timeLeft > 0) {
                    timerBox.className = "text-center text-xs sm:text-sm font-bold p-2.5 rounded bg-blue-50 border border-blue-200 text-blue-900 mb-4 shadow-sm";
                    let min = Math.floor((timeLeft % (1000 * 60 * 60)) / (1000 * 60));
                    let sec = Math.floor((timeLeft % (1000 * 60)) / 1000);
                    timerText.innerHTML = `⏱️ ढिला हाजिर रेकर्ड हुन बाँकी समय: <span class="text-red-600 font-extrabold text-sm sm:text-base ml-1">${min} मिनेट ${sec} सेकेन्ड</span>`;
                } else {
                    clearInterval(countdownInterval);
                    timerBox.className = "text-center text-xs sm:text-sm font-bold p-2.5 rounded bg-amber-100 border border-amber-300 text-amber-800 mb-4 shadow-sm animate-pulse";
                    timerText.innerHTML = `⚠️ नियमित समय समाप्त! अब हुने हाजिर 'Late Attendance' मा रेकर्ड हुनेछ।`;
                }
            }, 1000);
        }

        async function loadSystemStatus() {
            const statusIndicator = document.getElementById('statusIndicator');
            const timerBox = document.getElementById('countdownBox');
            try {
                const response = await fetch(SCRIPT_URL + "?action=getSystemStatus");
                const status = await response.json();
                
                if(status.day1 === "Active") {
                    statusIndicator.className = "text-center text-xs sm:text-sm font-bold p-2 rounded bg-green-100 text-green-800 mb-2";
                    statusIndicator.innerText = "● System Live: Presidents Meet Attendance Active";
                    if(status.day1Time) { timerBox.classList.remove('hidden'); startCountdownTimer(status.day1Time, status.serverTime); }
                } else {
                    statusIndicator.className = "text-center text-xs sm:text-sm font-bold p-2 rounded bg-red-100 text-red-700 mb-2";
                    statusIndicator.innerText = "✕ एटेन्डेन्स सिट लोड भइरहेको छ वा अहिले बन्द छ ।";
                    timerBox.classList.add('hidden');
                }
            } catch(e) {
                statusIndicator.className = "text-center text-xs sm:text-sm font-bold p-2 rounded bg-red-100 text-red-700 mb-2";
                statusIndicator.innerText = "✕ एटेन्डेन्स सिट लोड भइरहेको छ वा अहिले बन्द छ ।";
            }
        }

        async function submitAttendance() {
            const lionsId = document.getElementById('lionsId').value;
            if(!lionsId) return showDialog("चेतावनी !", "कृपया आफ्नो Membership Number हाल्नुहोस् ।", false);

            const loadingOverlay = document.getElementById('loadingOverlay');
            const loadingText = document.getElementById('loadingText');
            const submitBtn = document.getElementById('submitBtn');

            submitBtn.disabled = true;
            loadingOverlay.classList.remove('hidden');
            loadingText.innerText = "लोकेसन (GPS) जाँच्दै... कृपया पर्खिनुहोस् ।";

            navigator.geolocation.getCurrentPosition(async (pos) => {
                loadingText.innerText = "हाजिर सेभ हुँदैछ...";
                try {
                    const payload = {
                        action: "submitPresidentAttendance",
                        lionsId: lionsId,
                        day: "Day-1",
                        lat: pos.coords.latitude,
                        lon: pos.coords.longitude,
                        deviceId: navigator.userAgent
                    };

                    const response = await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify(payload) });
                    const msg = await response.text();
                    loadingOverlay.classList.add('hidden');
                    submitBtn.disabled = false;

                    if(msg === "Success") {
                        showDialog("हाजिर सफल !", "तपाईँको डिजिटल हाजिर सफलतापूर्वक दर्ता भयो ।", true);
                        document.getElementById('lionsId').value = "";
                    } else { showDialog("हाजिर हुन सकेन", msg, false); }
                } catch (error) {
                    loadingOverlay.classList.add('hidden'); submitBtn.disabled = false;
                    showDialog("सिस्टम एरर", "सर्भरसँग जडान हुन सकेन ।", false);
                }
            }, () => {
                loadingOverlay.classList.add('hidden'); submitBtn.disabled = false;
                showDialog("लोकेसन समस्या", "कृपया मोबाइलको GPS अन गरी लोकेसन अनुमति दिनुहोस् ।", false);
            }, { enableHighAccuracy: true, timeout: 8000 });
        }

        function showPage(pageId) {
            document.getElementById('userSection').classList.add('hidden');
            document.getElementById('loginForm').classList.add('hidden');
            document.getElementById('reportDashboard').classList.add('hidden');
            document.getElementById(pageId).classList.remove('hidden');
        }

        async function adminLogin() {
            const user = document.getElementById('user').value;
            const pass = document.getElementById('pass').value;
            if(!user || !pass) return showDialog("चेतावनी", "युजरनेम र पासवर्ड हाल्नुहोस्।", false);

            const loadingOverlay = document.getElementById('loadingOverlay');
            loadingOverlay.classList.remove('hidden');
            document.getElementById('loadingText').innerText = "विवरण जाँच्दै...";

            try {
                const response = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: "adminLogin", username: user, password: pass })
                });
                const result = await response.json();
                loadingOverlay.classList.add('hidden');

                if(result.status === "success") {
                    showPage('reportDashboard');
                    document.getElementById('d1SheetStatus').innerText = "Status: " + result.day1Active;
                    loadReport();
                } else { showDialog("लगइन असफल", result.message || "विवरण मिलेन ।", false); }
            } catch (e) { loadingOverlay.classList.add('hidden'); showDialog("सिस्टम एरर", "जडान हुन सकेन।", false); }
        }

        async function loadReport() {
            document.getElementById('reportData').innerHTML = "<p class='text-center text-sm font-semibold text-gray-500 py-4'>डाटा लोड हुँदैछ...</p>";
            try {
                const response = await fetch(SCRIPT_URL + "?action=getPresidentReport");
                const data = await response.json();
                currentReportData = data;
                
                let html = `<h3 class="font-bold text-green-600 text-sm mb-2">उपस्थित सूची (${data.present.length})</h3>`;
                if(data.present.length === 0) html += `<p class="text-xs text-gray-400 italic mb-4">कोही पनि हाजिर भएका छैनन्।</p>`;
                
                data.present.forEach(p => {
                    let late = p.timing === "Late" ? `<span class="bg-amber-500 text-white text-[9px] px-1 rounded ml-1">Late</span>` : "";
                    html += `
                    <div class="bg-white p-2.5 mb-2 shadow-sm rounded border present-row text-xs flex justify-between items-center">
                        <div><span class="font-bold text-gray-800 text-sm">${p.name} ${late}</span><span class="block text-[10px] text-gray-500">${p.club}</span></div>
                        <span class="px-1.5 py-0.5 rounded text-[10px] font-bold bg-green-100 text-green-700">Present</span>
                    </div>`;
                });

                html += `<h3 class="font-bold text-red-600 text-sm mt-6 mb-2">हाजिर हुन बाँकी (Absent) (${data.absent.length})</h3>`;
                if(data.absent.length === 0) html += `<p class="text-xs text-green-500 italic mb-4">सबै हाजिर भइसके।</p>`;
                
                data.absent.forEach(a => {
                    html += `
                    <div class="bg-white p-2.5 mb-2 shadow-sm rounded border absent-row flex justify-between items-center text-xs">
                        <div><span class="font-bold text-gray-800">${a.name}</span><span class="block text-[10px] text-gray-500">${a.club} | ID: ${a.id}</span></div>
                        <span class="px-1.5 py-0.5 rounded text-[10px] font-bold bg-red-100 text-red-700">Absent</span>
                    </div>`;
                });
                document.getElementById('reportData').innerHTML = html;
            } catch(e) { document.getElementById('reportData').innerHTML = "<p class='text-center text-xs text-red-500 font-bold py-2'>लोड गर्न सकिएन।</p>"; }
        }

        function downloadExcelReport() {
            let rows = [["S.N.", "Membership No", "Full Name", "Lions Club Name", "Status", "Timing"]];
            let counter = 1;
            currentReportData.present.forEach(p => { rows.push([counter++, p.id, p.name, p.club, "PRESENT", p.timing]); });
            currentReportData.absent.forEach(a => { rows.push([counter++, a.id, a.name, a.club, "ABSENT", "-"]); });
            const ws = XLSX.utils.aoa_to_sheet(rows);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Attendance");
            XLSX.writeFile(wb, `Presidents_Meet_Report.xlsx`);
        }

        function downloadPDFReport() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            doc.setFontSize(14); doc.text("Lions International District 325 F", 14, 15);
            doc.setFontSize(11); doc.text("Presidents Meet Attendance Summary", 14, 22);
            let bodyRows = []; let counter = 1;
            currentReportData.present.forEach(p => { bodyRows.push([counter++, p.id, p.name, p.club, "PRESENT", p.timing]); });
            currentReportData.absent.forEach(a => { bodyRows.push([counter++, a.id, a.name, a.club, "ABSENT", "-"]); });
            doc.autoTable({ startY: 28, head: [['S.N.', 'Membership No', 'Name', 'Lions Club', 'Status', 'Timing']], body: bodyRows, headStyles: { fillColor: [30, 58, 138] } });
            doc.save("Presidents_Meet_Report.pdf");
        }

        window.addEventListener('DOMContentLoaded', loadSystemStatus);
    </script>

    <div class="max-w-md w-full mx-auto p-6 flex-grow flex flex-col justify-center relative">
        
        <!-- Custom Dialog -->
        <div id="customDialog" class="hidden fixed inset-0 bg-black bg-opacity-60 flex flex-col justify-center items-center z-50 p-6 text-center">
            <div class="bg-white p-6 rounded-xl shadow-2xl flex flex-col items-center max-w-sm w-full border-t-8 border-blue-900">
                <div id="dialogIcon" class="text-4xl mb-2"></div>
                <h3 id="dialogTitle" class="text-xl font-bold mb-2"></h3>
                <p id="dialogMessage" class="text-sm text-gray-600 font-medium mb-6"></p>
                <button onclick="closeDialog()" class="w-full bg-blue-900 text-white p-2 rounded font-bold">OK</button>
            </div>
        </div>

        <!-- Loader Overlay -->
        <div id="loadingOverlay" class="hidden fixed inset-0 bg-black bg-opacity-50 flex flex-col justify-center items-center z-50 p-6 text-center">
            <div class="bg-white p-6 rounded-lg shadow-xl flex flex-col items-center max-w-xs w-full">
                <div class="loader mb-4"></div>
                <p id="loadingText" class="text-sm font-bold text-gray-800">प्रक्रिया सुरु हुँदैछ...</p>
            </div>
        </div>
        
        <!-- Attendance User Interface Window -->
        <div class="relative bg-white p-6 rounded-lg shadow-lg" id="userSection">
            <div class="absolute top-3 right-3">
                <button onclick="showPage('loginForm')" class="text-xs font-bold text-blue-900 bg-gray-100 px-2.5 py-1 rounded shadow-sm">🔒 Admin Login</button>
            </div>
            <div class="pt-4">
                <h2 class="text-2xl font-bold text-blue-900 mb-0.5 text-center">Lions International</h2>
                <h3 class="text-xl font-semibold text-blue-800 mb-0.5 text-center">District 325 F</h3>
                <p class="text-xs font-bold text-amber-600 mb-4 text-center tracking-wider">PRESIDENTS MEET DIGITAL ATTENDANCE</p>
                
                <div id="statusIndicator" class="text-center text-xs sm:text-sm font-medium p-2 rounded bg-gray-100 text-gray-600 mb-2">स्थिति लोड हुँदैछ...</div>
                <div id="countdownBox" class="hidden"><p id="countdownTimer" class="font-medium tracking-wide"></p></div>

                <input type="text" id="lionsId" placeholder="Membership Number" class="w-full border p-2 mb-4 rounded text-center font-bold tracking-wider text-gray-800">
                <button id="submitBtn" onclick="submitAttendance()" class="w-full bg-blue-900 text-white p-3 rounded font-bold hover:bg-blue-950 text-sm">SUBMIT ATTENDANCE</button>
            </div>
        </div>

        <!-- Admin Login Panel -->
        <div id="loginForm" class="hidden bg-gray-200 p-6 rounded-lg shadow-md border-t-4 border-gray-700">
            <h3 class="text-lg font-bold text-gray-800 text-center mb-4">Admin Login Panel</h3>
            <input type="text" id="user" placeholder="Username" class="w-full border p-2 mb-2 rounded bg-white text-sm">
            <input type="password" id="pass" placeholder="Password" class="w-full border p-2 mb-4 rounded bg-white text-sm">
            <button onclick="adminLogin()" class="w-full bg-gray-800 text-white p-2 rounded font-bold hover:bg-gray-900 text-sm mb-2">LOGIN ADMIN</button>
            <button onclick="showPage('userSection')" class="w-full text-xs text-gray-600 text-center underline font-semibold mt-2">← Back to Form</button>
        </div>

        <!-- Admin Control Room Dashboard -->
        <div id="reportDashboard" class="hidden bg-white p-4 rounded-lg shadow-lg mt-4 max-h-[85vh] overflow-y-auto">
            <div class="flex justify-between items-center border-b pb-2 mb-3">
                <h2 class="text-md font-bold text-gray-800">Admin Control Room</h2>
                <button onclick="showPage('userSection'); loadSystemStatus();" class="text-xs bg-gray-500 text-white px-2 py-1 rounded font-bold">Logout</button>
            </div>
            <div class="mb-4 text-[11px] text-gray-500 font-bold">
                <div class="p-2 bg-gray-50 rounded border text-center"><span id="d1SheetStatus">Attendance: Loading</span></div>
            </div>
            <div class="bg-blue-50 p-2.5 rounded border border-blue-200 mb-4">
                <div class="flex justify-between items-center mb-2">
                    <span class="text-xs font-bold text-blue-900">Live Attendance Report</span>
                    <button onclick="loadReport()" class="bg-green-600 text-white px-3 py-1 rounded text-xs font-bold">Refresh</button>
                </div>
                <div class="grid grid-cols-2 gap-2 pt-2 border-t border-blue-200">
                    <button onclick="downloadExcelReport()" class="bg-emerald-600 text-white font-bold p-1.5 rounded text-[11px] flex items-center justify-center gap-1">📊 Export Excel</button>
                    <button onclick="downloadPDFReport()" class="bg-rose-600 text-white font-bold p-1.5 rounded text-[11px] flex items-center justify-center gap-1">📄 Export PDF</button>
                </div>
            </div>
            <div id="reportData" class="text-left"></div>
        </div>

    </div>

    <!-- Footer -->
    <div class="fixed bottom-0 left-0 right-0 p-3 text-center border-t bg-white shadow-md z-40">
        <p class="text-xs font-semibold text-gray-500">
            Design by: <a href="https://www.facebook.com/nirajan.aryal.92" target="_blank" class="text-blue-600 hover:underline font-bold">Nirajan Aryal</a> | 📱 <span class="text-gray-700 font-bold">9851113811</span>
        </p>
    </div>
</body>
</html>
